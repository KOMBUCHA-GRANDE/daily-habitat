version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: dev-redis
    command: ["redis-server", "--appendonly", "yes"] # AOF로 데이터 보존(개발용)
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 선택: GUI로 키/값 보려면 켜두세요.
  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    depends_on:
      - redis